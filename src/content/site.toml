# --- The bar -----------------------------------------------------------------

[bar]
heading = "Behind the bar"
note = "Keg and tap — no cask, and we'd rather say so here than have you ask twice. The lager line-up moves about. The Guinness never does."

[[bar.taps]]
name = "Guinness"
style = "Irish stout"
note = "Two-part pour, left to settle, handed over when it's ready and not before."

[[bar.taps]]
name = "Camden Hells"
style = "Helles lager"
note = "Brewed up the road in Enfield. Cold, clean, gone quicker than you meant."

[[bar.taps]]
name = "Peroni"
style = "Italian lager"
note = "What the room drinks when the sun gets over the Broadway."

[[bar.taps]]
name = "Strongbow"
style = "Cider"
note = "Original, extra cold. No further notes required."

[[bar.taps]]
name = "Foster's"
style = "Lager"
note = "Still on, still sensible money, still exactly what some people want."

