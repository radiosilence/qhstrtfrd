# --- Getting here --------------------------------------------------------------

[travel]
heading = "Finding us"
lede = "Two minutes off Stratford Broadway, on the corner where West Ham Lane meets Tramway Avenue."

[[travel.routes]]
mode = "Tube, DLR & Overground"
detail = "Stratford — Central, Jubilee, Elizabeth line, DLR and Overground. 350 metres, about four minutes on foot."

[[travel.routes]]
mode = "London Stadium"
detail = "Fifteen minutes through Queen Elizabeth Olympic Park. Out of the door, left, and follow everyone else."

[[travel.routes]]
mode = "Bus"
detail = "Everything through Stratford Broadway and the bus station: 25, 86, 104, 108, 158, 238, 241, 262, 276, 308, 425, 473."

[[travel.routes]]
mode = "Driving"
detail = "No car park, and you're well inside the ULEZ. Stratford Centre and Westfield are the nearest, about five minutes away."

[access]
heading = "Getting in"
# Honest rather than flattering. A wasted journey is worse than an awkward sentence.
body = "There are steps at both entrances and no accessible toilet — we would rather tell you here than have you find out on the doorstep. If you are heading down and that is going to be a problem, ring the number below and we will do whatever we can to get you in and sat down."
