# The blunt facts, directly under the hero and above any prose, after the
# Southampton Arms: its whole homepage is an address and its hours.
[plain]
line1 = "Open 11am every day. Close 11pm, 10pm Sundays."
line2 = "5 West Ham Lane, Stratford E15 4PH. Two minutes off the Broadway."
line3 = "Step-free, dogs welcome, no kitchen. Cash and card."

# The island bar and the chequerboard skirt are a visitor's description; the
# refit is Stonegate's own announcement.
[about]
heading = "The local on West Ham Lane"
body = [
  "The bar runs down the middle with a chequerboard skirt along the front of it. Booths against the wall, armchairs that have taken a battering and held up, and six screens put where you can actually see them.",
  "No kitchen, no cask. Guinness poured properly, every game that matters, and a refit in 2023 that gave the place new carpets, new lighting and a new sign with the Queen on it."
]

# Who drinks here. Every strand of this is drawn from what the pub actually
# puts on — an Irish pub with live music and salsa, 80s nights, singalongs and
# a drag night, dogs welcome, sport on all day. That is a broad church by any
# measure, and saying so is description rather than decoration.
[welcome]
heading = "Everybody's local"
lede = "A room that has never much minded who you are."
body = "In one week this place is an Irish pub, a sports bar, a salsa floor, an 80s night, a drag night and somebody's nan's birthday in the corner booth. Some of the regulars have thirty years on you. Nobody minds."

# Stonegate's announcement says the pub shows West Ham; the walk is TfL's
# measurement.
[matchday]
heading = "Claret and blue, before and after"
lede = "West Ham on the screens, and the ground a walk through the park."
body = "Doors at eleven, every day. On a home Saturday that's hours before kick-off, which is the idea: early game on, room filling, then everyone walks up together. Come back after — it's open till eleven."
walk_detail = "About 25 minutes on foot, by TfL's reckoning, through Queen Elizabeth Olympic Park."

