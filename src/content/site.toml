# --- FAQ ----------------------------------------------------------------------
# Rendered with FAQPage structured data. Every answer is sourced; none invents
# a policy the pub has not stated.

[[faq]]
q = "Do you show West Ham?"
a = "Yes. The pub has Sky Sports and TNT Sports on six HD screens, and Craft Union named West Ham's European fixtures specifically when the pub reopened after its refit."

[[faq]]
q = "Is it dog friendly?"
a = "Yes — the operator lists the Queen's Head as a dog-friendly pub."

[[faq]]
q = "Do you serve food?"
a = "No. There is no kitchen here. It is a pub for drinking in, and there is a great deal of food within a few minutes' walk on the Broadway."

[[faq]]
q = "Do you have real ale?"
a = "No. CAMRA records the Queen's Head as not serving cask ale. It is a keg and tap house — Guinness, lagers, and cider."

[[faq]]
q = "How far is the London Stadium?"
a = "About 1.7 km, which TfL puts at roughly 25 minutes on foot through Queen Elizabeth Olympic Park."

[[faq]]
q = "Is it step-free?"
a = "No. There are steps at the entrance and there is no accessible toilet. Ring the bar on 020 8536 1066 before you travel and ask what can be done."

[[faq]]
q = "Can I book it for a party?"
a = "Ring the bar and ask. The Queen's Head is run as a community pub, but any terms are for the pub to set, so speak to them directly rather than taking a website's word for it."

[[faq]]
q = "What time do you open?"
a = "Eleven in the morning, every day. Last orders are at eleven at night Monday to Saturday, and ten on Sunday."

# --- History ------------------------------------------------------------------
# The hard part to get right, so the hedging is deliberate and stays in.
#
# We know the pub was there in 1985 because CAMRA holds a photograph of it from
# that year. We do NOT know when it opened, and nothing found says. So the copy
# says "photographed in 1985", never "established in 1985" — those are different
# claims and only one of them is supported.
#
# The Stratford context is Victoria County History via British History Online,
# which is about as solid as local history gets.

[history]
heading = "Older than the skyline"
lede = "Nobody found a founding date, so this does not claim one. What follows is what can actually be shown."
note = "If you know more about this pub's history — and somebody drinking in it certainly does — the bar would like to hear it."

[[history.moments]]
year = "1839"
approx = false
body = "The Eastern Counties Railway reaches Stratford and turns a village on the edge of Essex into a junction. The population goes up and the pubs go up with it. Stratford at this point is a ward of the parish of West Ham — which is where the lane outside gets its name, long before it belonged to a football club."

[[history.moments]]
year = "1965"
approx = false
body = "West Ham and East Ham are abolished as boroughs and folded into the new London Borough of Newham. Stratford stops being Essex and starts being London, on paper at least."

[[history.moments]]
year = "1985"
approx = false
body = "The earliest hard evidence of this pub that turned up: a photograph of the Queen's Head on West Ham Lane, held in CAMRA's archive. Another follows in 1987. It was plainly not new then, but how much older is not something any source consulted would say."

[[history.moments]]
year = "Later"
approx = true
body = "At some point the pub trades as Le Pub, a name CAMRA still records as a former one. It did not stick, and the Queen's Head came back."

[[history.moments]]
year = "2012"
approx = false
body = "The Olympics arrive next door. Stratford gets Westfield, a park, and a stadium; the neighbourhood is rebuilt around the pub rather than including it. In 2016 that stadium becomes West Ham's home ground, a mile and a bit up the road from a pub already standing on the lane with the same name."

[[history.moments]]
year = "2023"
approx = false
body = "Craft Union spends over £100,000 on a refit — furniture, fittings, carpets, lighting and six HD screens — and puts up a new sign carrying an image of Queen Elizabeth II. The reason given at the time was that the changes should reflect the kind of venue it is, and the East End itself."

