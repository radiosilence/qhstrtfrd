# --- FAQ ----------------------------------------------------------------------
# Rendered with FAQPage structured data. Every answer is sourced; none invents
# a policy the pub has not stated.

[[faq]]
q = "Do you show West Ham?"
a = "Yes. The pub has Sky Sports and TNT Sports on six HD screens, and Craft Union named West Ham's European fixtures specifically when the pub reopened after its refit."

[[faq]]
q = "Is it dog friendly?"
a = "Yes — the operator lists the Queen's Head as a dog-friendly pub."

[[faq]]
q = "Do you serve food?"
a = "No. There is no kitchen here. It is a pub for drinking in, and there is a great deal of food within a few minutes' walk on the Broadway."

[[faq]]
q = "Do you have real ale?"
a = "No. CAMRA records the Queen's Head as not serving cask ale. It is a keg and tap house — Guinness, lagers, and cider."

[[faq]]
q = "How far is the London Stadium?"
a = "About 1.7 km, which TfL puts at roughly 25 minutes on foot through Queen Elizabeth Olympic Park."

[[faq]]
q = "Is it step-free?"
a = "No. There are steps at the entrance and there is no accessible toilet. Ring the bar on 020 8536 1066 before you travel and ask what can be done."

[[faq]]
q = "Can I book it for a party?"
a = "Ring the bar and ask. The Queen's Head is run as a community pub, but any terms are for the pub to set, so speak to them directly rather than taking a website's word for it."

[[faq]]
q = "What time do you open?"
a = "Eleven in the morning, every day. Last orders are at eleven at night Monday to Saturday, and ten on Sunday."

# --- History ------------------------------------------------------------------
# The hard part to get right, so the hedging is deliberate and stays in.
#
# We know the pub was there in 1985 because CAMRA holds a photograph of it from
# that year. We do NOT know when it opened, and nothing found says. So the copy
# says "photographed in 1985", never "established in 1985" — those are different
# claims and only one of them is supported.
#
# The Stratford context is Victoria County History via British History Online,
# which is about as solid as local history gets.

[history]
heading = "The lane, and the pub on it"
lede = "The pub cannot be dated. The ground it stands on can, and the story attached to the name over the door is a genuinely good one."
note = "None of the older history below is a claim about this pub — it is the story of the place and the name. If you know when the Queen's Head actually opened, the bar would like to hear it, because nobody writing this could find out."

# The area. Every entry checked rather than remembered; this is the romance,
# and it is only worth having because it is true.

[[history.moments]]
year = "1067"
approx = false
body = "The name is first written down as Stratford — Old English for a ford on a Roman road. The road ran from Aldgate out to Romford, Chelmsford and Colchester, and somewhere just north of what is now Stratford High Street it crossed the River Lea. The whole place is named after the act of getting across the water."

[[history.moments]]
year = "1135"
approx = false
body = "Cistercian monks found Stratford Langthorne Abbey. It becomes one of the largest and wealthiest monasteries in England — 1,500 acres here and twenty manors scattered across Essex. Henry VIII dissolves it in 1538, and the people living nearby carry the stone home and build with it. There is a good chance parts of that abbey are still standing around here, in walls nobody thinks twice about."

[[history.moments]]
year = "1839"
approx = false
body = "Stratford station opens on 20 June, on the Eastern Counties Railway. A village on the edge of Essex becomes a junction more or less overnight, and the people arrive who need somewhere to drink."

[[history.moments]]
year = "1847"
approx = false
body = "The Great Eastern Railway works open just north of here and eventually employ over 2,500 people. Before they close in 1991 they build 1,682 locomotives, 5,500 carriages and 33,000 goods wagons. For a century and a half this is a place that makes things out of iron."

[[history.moments]]
year = "1895"
approx = false
body = "Down the river at Thames Ironworks — the largest and last surviving shipbuilder on the Thames — a foreman named Dave Taylor and the owner, Arnold Hills, start a works football team. Thames Ironworks FC. The hammers that ended up crossed on the badge are riveting hammers, the tools the men used to fix iron plates onto ships."

[[history.moments]]
year = "1900"
approx = false
body = "On 5 July the club is relaunched as West Ham United, taking the name of the district it played in — the same parish name carried by the lane this pub stands on. The crossed hammers are not only the club's: they sit in the coat of arms of the old County Borough of West Ham, and in the London Borough of Newham's arms today. The hammers belong to the borough as much as the team."

[[history.moments]]
year = "2016"
approx = false
body = "After 112 years at the Boleyn Ground, West Ham move to the London Stadium — back into Stratford, a mile and a bit from a pub already standing on a lane that had been carrying the name West Ham the whole time."

# The pub itself. Thinner, hedged, and clearly separated from the above.

[[history.moments]]
year = "1985"
approx = false
body = "The earliest hard evidence of this pub that turned up anywhere: a photograph of the Queen's Head on West Ham Lane in CAMRA's archive. Another follows in 1987. It was plainly not new then, but no source consulted would say how much older — so this page does not guess."

[[history.moments]]
year = "Later"
approx = true
body = "At some point it trades as Le Pub, a name CAMRA still records as a former one. It did not stick. The Queen's Head came back, as these things tend to."

[[history.moments]]
year = "2023"
approx = false
body = "Craft Union spends over £100,000 on a refit — furniture, fittings, carpets, lighting and six HD screens — and puts up a new sign carrying an image of Queen Elizabeth II. The stated reason was that the changes should reflect the kind of venue it is, and the East End itself."

