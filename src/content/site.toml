# --- FAQ ----------------------------------------------------------------------
# Rendered with FAQPage structured data. Every answer is sourced; none invents
# a policy the pub has not stated.

[[faq]]
q = "Do you show West Ham?"
a = "Yes. Sky Sports and TNT on six screens, league games and European nights alike."

[[faq]]
q = "Is it dog friendly?"
a = "Yes. Dogs are welcome and there is usually one in already."

[[faq]]
q = "Do you serve food?"
a = "No — there is no kitchen. There is a great deal of food two minutes away on the Broadway, and nobody minds which of it you eat before you come in."

[[faq]]
q = "Do you have real ale?"
a = "No cask, no handpumps. This is a keg house — Guinness, lagers and cider, all of it cold."

[[faq]]
q = "How far is the London Stadium?"
a = "A mile or so — about twenty-five minutes on foot, straight through the Olympic Park."

[[faq]]
q = "Is it step-free?"
a = "No. There are steps at the door and no accessible toilet. Ring the bar on 020 8536 1066 before you travel and ask."

[[faq]]
q = "Can I book it for a party?"
a = "Ring the bar and ask. They will tell you what is possible far better than a website can."

[[faq]]
q = "What time do you open?"
a = "Eleven in the morning, every day. Last orders are at eleven at night Monday to Saturday, and ten on Sunday."

# --- History ------------------------------------------------------------------
# The hard part to get right, so the hedging is deliberate and stays in.
#
# We know the pub was there in 1985 because CAMRA holds a photograph of it from
# that year. We do NOT know when it opened, and nothing found says. So the copy
# says "photographed in 1985", never "established in 1985" — those are different
# claims and only one of them is supported.
#
# The Stratford context is Victoria County History via British History Online,
# which is about as solid as local history gets.

[history]
heading = "The lane, and the pub on it"
lede = "Nobody knows how old this pub is. The lane it stands on is a different matter, and the story attached to the name over the door is one of the best in London."
note = "Somebody drinking in here knows more about this place than the internet does. If that's you, the bar would like a word."

[[history.moments]]
year = "1067"
approx = false
body = "The name goes into the written record as Strætforda — the ford on the Roman road. The road came out of Aldgate and ran for Colchester, and somewhere just north of the High Street it met the River Lea and had to get across. Everything here begins with that crossing. The whole place is named after the act of getting to the other side."

[[history.moments]]
year = "1135"
approx = false
body = "Cistercian monks raise Stratford Langthorne Abbey on the marsh. It grows into one of the richest houses in England — fifteen hundred acres underfoot and twenty manors scattered across Essex. Four hundred years later Henry VIII pulls it down, and the people living round about come and take the stone away by the cartload to build with. It never left. It is still here, in garden walls and foundations, holding up buildings that have no idea what they are made of."

[[history.moments]]
year = "1839"
approx = false
body = "On the twentieth of June a station opens on the Eastern Counties Railway and the village stops being a village. Within a generation Stratford is a junction, and a junction means thousands of men arriving with a thirst and nowhere yet to take it."

[[history.moments]]
year = "1847"
approx = false
body = "The locomotive works open just up the road. Before they close in 1991 they turn out one thousand six hundred and eighty-two engines, five and a half thousand carriages and thirty-three thousand wagons, and at their height two and a half thousand people walk through the gates. For a century and a half this is a place that makes enormous things out of iron, and goes for a pint afterwards."

[[history.moments]]
year = "1895"
approx = false
body = "Downriver at Thames Ironworks — the last great shipbuilder left on the Thames — a foreman called Dave Taylor and the owner, Arnold Hills, get a works team together. They call it Thames Ironworks FC. The hammers that end up crossed on the badge are not decoration and never were: they are riveting hammers, the tools those men swung all day to beat iron plates onto hulls."

[[history.moments]]
year = "1900"
approx = false
body = "On the fifth of July the club is reborn as West Ham United, taking the name of the parish it played in. The same parish name that was already on this lane, and had been for centuries before anyone kicked a ball. And the hammers went further than the team — they are in the arms of the old Borough of West Ham, and they are in Newham's arms today. Round here the hammers belong to everybody."

[[history.moments]]
year = "2016"
approx = false
body = "After a hundred and twelve years at the Boleyn Ground the club moves to the London Stadium and comes back into Stratford — a mile and a bit from a pub that had been standing on West Ham Lane the whole time, quietly keeping the name warm."

[[history.moments]]
year = "1985"
approx = false
body = "The oldest photograph anyone has of this pub was taken in 1985. There is another from 1987. It is not a picture of a new building — it is a picture of somewhere that had already been there a long while, doing exactly what it does now."

[[history.moments]]
year = "Le Pub"
approx = true
body = "For a spell it traded under another name. It didn't take. The Queen's Head came back, the way these things do."

[[history.moments]]
year = "2023"
approx = false
body = "Over a hundred thousand pounds goes into the place — furniture, fittings, carpets, lighting, six new screens — and a new sign goes up outside with Queen Elizabeth II on it. The idea, as it was put at the time, was that the pub should look like what it actually is, and like the East End it stands in."

