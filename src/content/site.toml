# Everything about the pub that a person might want to change, in one file.
#
# The generator derives the rest: weekday names come from the date, the JSON-LD
# opening hours come from `[[hours]]`, and an event whose date has passed stops
# rendering. Nothing here is repeated in a template.

[venue]
name = "The Queen's Head"
short_name = "Queen's Head Stratford"
# Used where the full name would wrap badly — the nav mark, the footer.
initials = "QH"
tagline = "On West Ham Lane, where it should be."
# One sentence, under 160 characters: this is the meta description and the thing
# Google prints under the link.
summary = "The Queen's Head, Stratford E15. A claret-and-blue local on West Ham Lane — Guinness poured properly, every match on, and a walk to the London Stadium."
street = "5 West Ham Lane"
street_alt = "Second entrance on Tramway Avenue"
locality = "Stratford"
city = "London"
region = "Greater London"
postcode = "E15 4PH"
country = "GB"
phone_display = "020 8536 1066"
phone_link = "+442085361066"
latitude = 51.539593
longitude = 0.003900
facebook = "https://www.facebook.com/stratfordqueenshead/"
instagram = "https://www.instagram.com/queenshead.stratford/"
# Sets canonical URLs, og:url and the sitemap. No trailing slash.
origin = "https://queensheadstratford.london"

# The room, on the homepage. Three paragraphs, no more.
[about]
heading = "The local, on the lane that gave the club its name"
body = [
  "Some pubs are near West Ham. This one is on West Ham Lane — the same lane, the same corner, a claret-and-blue room that was here for the Boleyn and is still here for the London Stadium. Fifteen minutes up the road on a matchday, and every one of those minutes is spent with people singing.",
  "Inside it is a U-shaped bar, a chequerboard skirt along the counter, booths down the wall and armchairs that have earned their place. Screens where you want them. A dartboard in the back that has settled more arguments than it started. The Guinness gets the time it needs — nobody here has ever rushed a pour and nobody ever will.",
  "It has served this corner for the better part of forty years, through a spell under a name nobody uses any more, through the Olympics arriving on the doorstep and half the neighbourhood being rebuilt around it. The glass towers went up. The Queen's Head stayed exactly where it was, which is the entire point of it."
]

# The matchday pitch. Its own block because it is the thing the pub is for.
[matchday]
heading = "Claret and blue, before and after"
lede = "The London Stadium is a fifteen-minute walk through the park. This is where you start and where you come back to."
body = "Doors open at eleven, and on a home Saturday the room fills long before kick-off — pints on the counter, the early game on, the day being talked into shape. Come back after and it'll still be going. Bubbles has been sung in here more times than anyone has counted, and it will be sung again."
walk = "15 minutes on foot through Queen Elizabeth Olympic Park"

