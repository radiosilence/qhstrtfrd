# --- Functions ----------------------------------------------------------------
# No hire fee, no minimum spend and no capacity figure are claimed, because
# nothing published states any of them. It says ring and ask, which is true.

[functions]
heading = "Birthdays, wakes and send-offs"
body = "Craft Union describes the Queen's Head as a community pub and it behaves like one. If you want to put something on here — a birthday, a christening, a leaving do, a send-off done properly — the thing to do is ring the bar and ask. Terms are between you and the pub, and they will tell you straight."

