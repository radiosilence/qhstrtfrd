# Everything about the pub, in one file.
#
# RULE: every factual claim here must be traceable to `[[sources]]` at the
# bottom. Atmosphere and voice are free; specifics are not. No invented event,
# time, price, or promise — this is somebody's real business and a wrong claim
# on it is their problem, not ours.
#
# Where sources disagree, the operator's own page wins on anything current
# (hours, facilities) and CAMRA wins on anything the operator does not publish.
# Where nothing says it, it does not go on the site.

# The thing that keeps this site out of trouble.
#
# It is an unofficial site for a real pub, built by somebody who drinks in it.
# The goodwill in the name belongs to the operator, not to us, so the page says
# plainly what it is and points at the official one. That single sentence is
# what separates "a fan site" from "a misrepresentation", which is the whole of
# a passing-off claim.
[disclaimer]
text = "An unofficial site, made by locals because we like the place. Not affiliated with, endorsed by or operated by Craft Union Pub Company or Stonegate Group. Hours and details are gathered from public sources and can change — ring the bar to be sure."
official_label = "Official Craft Union page"
official_url = "https://www.craftunionpubs.com/queens-head-stratford"

[venue]
name = "The Queen's Head"
short_name = "Queen's Head Stratford"
initials = "QH"
tagline = "On West Ham Lane, where it should be."
summary = "The Queen's Head, Stratford E15. A traditional pub on West Ham Lane — Guinness, every match on six HD screens, darts in the back, and a walk to the London Stadium."
street = "5 West Ham Lane"
street_alt = "Second entrance on Tramway Avenue"
locality = "Stratford"
city = "London"
region = "Greater London"
postcode = "E15 4PH"
country = "GB"
phone_display = "020 8536 1066"
phone_link = "+442085361066"
latitude = 51.539593
longitude = 0.003900
facebook = "https://www.facebook.com/stratfordqueenshead/"
instagram = "https://www.instagram.com/queenshead.stratford/"
origin = "https://queensheadstratford.london"

# The room. Descriptive, and every concrete detail is sourced — the U-shaped
# bar and the chequerboard skirt from a visitor's description, the refit from
# Stonegate's own announcement, the two entrances from CAMRA.
[about]
heading = "The local on West Ham Lane"
body = [
  "A U-shaped room with the bar down the middle and a chequerboard skirt along the counter. Booths against the wall, armchairs that have held up, and screens where you want them rather than everywhere at once. Two ways in — one on West Ham Lane, one on Tramway Avenue — which is the sort of thing you only notice about a pub you already know.",
  "It is a traditional pub and it does not pretend to be anything else. There is no kitchen. There is no cask. What there is, is Guinness given the time it needs, a dartboard in the back, and every match that matters on six screens.",
  "In 2023 Craft Union put over £100,000 into the place — furniture, fittings, carpets, lighting and the six HD screens — and gave it a new sign with Queen Elizabeth II on it. The room it reopened into is the one described above, and the reason for the refit was stated plainly at the time: the changes reflect the kind of venue this is, and the East End itself."
]

# West Ham. Sourced: Stonegate's own announcement says the pub shows West Ham
# matches. The walk is measured by TfL, not guessed.
[matchday]
heading = "Claret and blue, before and after"
lede = "West Ham on the screens, and the London Stadium a walk away through the park."
body = "Doors open at eleven every day of the week, which on a home Saturday is a long time before kick-off and exactly the point. The pub has shown West Ham's European nights since the refit and shows the league games too. Come back after; it is open until eleven."
walk_label = "1.7 km to the London Stadium"
walk_detail = "About 25 minutes on foot, by TfL's reckoning, through Queen Elizabeth Olympic Park."

