# --- Weekly regulars ----------------------------------------------------------
# Evergreen: these render as "every Thursday" and never go stale.

[[regulars]]
name = "Salsa Thursdays"
when = "Thursdays"
time = "From 8pm"
blurb = "The floor clears, the music goes on, and the room becomes something else entirely for a few hours. Beginners genuinely welcome — somebody will show you the step before you've finished your first drink."

[[regulars]]
name = "Live music"
when = "Fridays & Saturdays"
time = "From 9pm"
blurb = "Guitars, covers, the occasional full band folded into the corner by the window. No cover charge, no guest list, no nonsense."

[[regulars]]
name = "Darts & pool"
when = "Every day"
time = "Whenever you fancy"
blurb = "Board's in the back, table's free, chalk is where it has always been. Winner stays on, and the regulars will explain the house rules whether or not you asked."

